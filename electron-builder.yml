appId: cn.companion.manager
productName: QQ-DSH-Manager
directories:
  # 默认输出到项目内 release/。
  # 若本机把项目放在受保护的目录（桌面/文档等），app.asar 可能被安全钩子锁住导致重复打包失败，
  # 这时改成系统临时目录即可（把 <用户名> 换成自己的）：
  #   output: C:/Users/<用户名>/AppData/Local/Temp/cm-release
  output: release
files:
  - src/**
  - package.json
win:
  # 无管理员权限/开发者模式的机器上 winCodeSign 符号链接解压会失败，跳过 exe 元数据编辑
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: QQ-DSH-Manager
portable:
  artifactName: QQ-DSH-Manager-便携版-${version}.exe
